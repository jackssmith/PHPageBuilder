name: Testing WW2

on:
  workflow_dispatch:

jobs:
  secure-void:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core void Settings
        run: |
          Write-Host "Starting void Configuration..."
          [System.Console]::Out.Flush()
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Write-Host "✓ Disabled TSConnections"
          [System.Console]::Out.Flush()
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\void-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Write-Host "✓ Disabled UserAuthentication"
          [System.Console]::Out.Flush()
          
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\void-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force
          Write-Host "✓ Set SecurityLayer to 0"
          [System.Console]::Out.Flush()

          netsh advfirewall firewall delete rule name="void-Tailscale" 2>$null
          Write-Host "✓ Cleared existing firewall rule"
          [System.Console]::Out.Flush()
          
          netsh advfirewall firewall add rule name="void-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Write-Host "✓ Added void firewall rule"
          [System.Console]::Out.Flush()

          Restart-Service -Name TermService -Force
          Write-Host "✓ Restarted void Service"
          [System.Console]::Out.Flush()

      - name: Create void User with Secure Password
        run: |
          Write-Host "Creating void user..."
          [System.Console]::Out.Flush()
          
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "void" -Password $securePass -AccountNeverExpires
          Write-Host "✓ Created void user"
          [System.Console]::Out.Flush()
          
          Add-LocalGroupMember -Group "Administrators" -Member "void"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "void"
          Write-Host "✓ Added void to admin groups"
          [System.Console]::Out.Flush()
          
          echo "void_CREDS=User: void | Password: $password" >> $env:GITHUB_ENV
          Write-Host "✓ Credentials set in environment"
          [System.Console]::Out.Flush()
          
          if (-not (Get-LocalUser -Name "void")) {
              Write-Error "User creation failed"
              exit 1
          }
          Write-Host "✓ void user verified"
          [System.Console]::Out.Flush()

      - name: Install Tailscale
        run: |
          Write-Host "Installing Tailscale..."
          [System.Console]::Out.Flush()
          
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Write-Host "✓ Downloaded Tailscale"
          [System.Console]::Out.Flush()
          
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Write-Host "✓ Tailscale installed"
          [System.Console]::Out.Flush()
          
          Remove-Item $installerPath -Force
          Write-Host "✓ Cleanup complete"
          [System.Console]::Out.Flush()

      - name: Establish Tailscale Connection
        run: |
          Write-Host "Establishing Tailscale connection..."
          [System.Console]::Out.Flush()
          
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          Write-Host "✓ Tailscale command executed"
          [System.Console]::Out.Flush()
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Write-Host "  [Attempt $($retries + 1)/10] Waiting for IP assignment..."
              [System.Console]::Out.Flush()
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "✓ Tailscale IP assigned: $tsIP"
          [System.Console]::Out.Flush()
      
      - name: Install WinRAR
        run: |
          Write-Host "Installing WinRAR..."
          [System.Console]::Out.Flush()
          
          $winrarUrl = "https://www.rarlab.com/rar/winrar-x64-701.exe"
          $installerPath = "$env:TEMP\winrar-setup.exe"
          
          Invoke-WebRequest -Uri $winrarUrl -OutFile $installerPath
          Write-Host "✓ Downloaded WinRAR"
          [System.Console]::Out.Flush()
          
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          Write-Host "✓ WinRAR installed"
          [System.Console]::Out.Flush()
          
          Remove-Item $installerPath -Force
          Write-Host "✓ WinRAR installation complete"
          [System.Console]::Out.Flush()

      - name: Install Notepad++
        run: |
          Write-Host "Installing Notepad++..."
          [System.Console]::Out.Flush()
          
          $nppUrl = "https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.6.9/npp.8.6.9.Installer.x64.exe"
          $installerPath = "$env:TEMP\npp-setup.exe"
          
          Invoke-WebRequest -Uri $nppUrl -OutFile $installerPath
          Write-Host "✓ Downloaded Notepad++"
          [System.Console]::Out.Flush()
          
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          Write-Host "✓ Notepad++ installed"
          [System.Console]::Out.Flush()
          
          Remove-Item $installerPath -Force
          Write-Host "✓ Notepad++ installation complete"
          [System.Console]::Out.Flush()

      - name: Maintain Connection
        run: |
          Write-Host "`n=== void ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: void"
          Write-Host "Password: $(echo $env:void_CREDS)"
          Write-Host "xfreevoid /v:$env:TAILSCALE_IP /u:void /p:'$env:void_CREDS' /dynamic-resolution"
          Write-Host "==================`n"
          [System.Console]::Out.Flush()
          
          $iteration = 0
          while ($true) {
              $iteration++
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] void Active (iteration: $iteration) - Use Ctrl+C in workflow to terminate"
              [System.Console]::Out.Flush()
              Start-Sleep -Seconds 60
          }
