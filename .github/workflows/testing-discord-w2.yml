name: Testing W2-discord

on:
  workflow_dispatch:

jobs:
  secure-void-discord:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core void discord Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                               -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                               -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                               -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          
          # For testing, allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create discord chat
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)      # A-Z
              Lower   = [char[]](97..122)     # a-z
              Number  = [char[]](48..57)      # 0-9
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126)) # Special characters
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          # Exporting credentials for later steps
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection for Discord chat
        env:
          BASE64_AUTH_KEY: ${{ secrets.DISCORD_CHAT }}
        run: |
          $decodedKey = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($env:BASE64_AUTH_KEY))
          
          Write-Output "::add-mask::$decodedKey"
          
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=$decodedKey --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4).Trim()
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Install WinRAR
        run: |
          Write-Host "Installing WinRAR..."
          $winrarUrl = "https://www.rarlab.com/rar/winrar-x64-701.exe"
          $installerPath = "$env:TEMP\winrar-setup.exe"
          
          Invoke-WebRequest -Uri $winrarUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          Remove-Item $installerPath -Force
          Write-Host "WinRAR installed successfully"

      - name: Install Notepad++
        run: |
          Write-Host "Installing Notepad++..."
          $nppUrl = "https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.6.9/npp.8.6.9.Installer.x64.exe"
          $installerPath = "$env:TEMP\npp-setup.exe"
          
          Invoke-WebRequest -Uri $nppUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait
          Remove-Item $installerPath -Force
          Write-Host "Notepad++ installed successfully"

      - name: Configure Environment
        run: |
          Write-Host "Applying settings to the Default User profile so the RDP user inherits them..."
          
          # Map the HKU drive for PowerShell
          New-PSDrive -Name HKU -PSProvider Registry -Root HKEY_USERS -ErrorAction Ignore | Out-Null
          
          # Load Default User registry
          reg load "HKU\DefaultUser" "C:\Users\Default\NTUSER.DAT"
          
          # 1. Dark Mode
          $themeKey = "HKU:\DefaultUser\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          if (-not (Test-Path $themeKey)) { New-Item -Path $themeKey -Force | Out-Null }
          Set-ItemProperty -Path $themeKey -Name "AppsUseLightTheme" -Value 0
          Set-ItemProperty -Path $themeKey -Name "SystemUsesLightTheme" -Value 0
          
          # 2. Solid Black Background
          Set-ItemProperty -Path "HKU:\DefaultUser\Control Panel\Colors" -Name "Background" -Value "0 0 0"
          Set-ItemProperty -Path "HKU:\DefaultUser\Control Panel\Desktop" -Name "Wallpaper" -Value ""
          
          # 3. Desktop Icons (Matching image_e3cbc6.png exactly)
          $iconKey = "HKU:\DefaultUser\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel"
          if (-not (Test-Path $iconKey)) { New-Item -Path $iconKey -Force | Out-Null }
          Set-ItemProperty -Path $iconKey -Name "{20D04FE0-3AEA-1069-A2D8-08002B30309D}" -Value 0 # Computer
          Set-ItemProperty -Path $iconKey -Name "{59031a47-3f72-44a7-89c5-5595fe6b30ee}" -Value 0 # User's Files
          Set-ItemProperty -Path $iconKey -Name "{208D2C60-3AEA-1069-A2D7-08002B30309D}" -Value 0 # Network
          Set-ItemProperty -Path $iconKey -Name "{5399E694-6CE5-4D6C-8FCE-1D8870FDCBA0}" -Value 0 # Control Panel
          Set-ItemProperty -Path $iconKey -Name "{645FF040-5081-101B-9F08-00AA002F954E}" -Value 0 # Recycle Bin
          
          # Apply hidden files and extensions to Default User as well to guarantee it works for RDP
          $advKey = "HKU:\DefaultUser\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
          if (-not (Test-Path $advKey)) { New-Item -Path $advKey -Force | Out-Null }
          Set-ItemProperty -Path $advKey -Name "HideFileExt" -Value 0
          Set-ItemProperty -Path $advKey -Name "Hidden" -Value 1
          
          # Unload Default User registry securely
          [gc]::Collect()
          Start-Sleep -Seconds 2
          reg unload "HKU\DefaultUser"
          
          Write-Host "Running requested explicit command (expecting red Stop-Process error)..."
          
          # 4. User's exact requested command
          # 'Continue' ensures the error prints but does not halt the workflow
          $ErrorActionPreference = 'Continue'
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name HideFileExt -Value 0; Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name Hidden -Value 1; Stop-Process -Name explorer -Force

      - name: out void
        run: |
          Write-Host "`n=== Void OUT ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "`nQuick Connect Command:"
          Write-Host "xfreerdp /v:$env:TAILSCALE_IP /u:RDP /p:'$env:RDP_PASSWORD' /dynamic-resolution"
          Write-Host "==================`n"

      - name: Maintain Connection
        run: |
          # Keep runner active until the 6-hour GitHub timeout or manually cancelled
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use 'Cancel workflow' in GitHub to terminate"
              Start-Sleep -Seconds 300
          }
